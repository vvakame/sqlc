version: "3.8"
services:
  mysql:
    image: "mysql/mysql-server:8.0"
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_DATABASE: dinotest
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_ROOT_HOST: '%'

  postgresql:
    image: "postgres:16"
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres

  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:1.5.33
    # docker run gcr.io/cloud-spanner-emulator/emulator ./gateway_main --help
    # docker run gcr.io/cloud-spanner-emulator/emulator ./emulator_main --helpfull
    entrypoint:
      - './gateway_main'
      - '--hostname'
      - '0.0.0.0'
      - '--log_requests' # requires -copy_emulator_stdout
      - '-copy_emulator_stderr'
      - '-copy_emulator_stdout'
    ports:
      - 9010:9010
      - 9020:9020
